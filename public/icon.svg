<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle for maskable/any compatibility -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.8" />
  <circle cx="256" cy="256" r="206" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 8" opacity="0.6" />

  <!-- Dynamic Speed Wind Trails -->
  <path d="M 60 210 Q 180 200 240 210" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M 90 260 Q 200 250 250 260" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  <path d="M 70 310 Q 170 300 230 310" stroke="#ef4444" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Central Speed Flame / Runner Wing -->
  <path d="M 280 120 C 360 140 410 220 370 320 C 340 390 260 410 220 400 C 300 370 320 310 290 270 C 260 230 250 170 280 120 Z" fill="url(#fire)" filter="url(#glow)" />

  <!-- Tire / Bibendum Symbol -->
  <circle cx="210" cy="240" r="54" fill="#1e293b" stroke="#ffffff" stroke-width="12" />
  <circle cx="210" cy="240" r="26" fill="#0f172a" stroke="#cbd5e1" stroke-width="6" />

  <!-- Yellow Ruler (Baldi) Crossing -->
  <rect x="230" y="150" width="18" height="130" rx="3" transform="rotate(35 230 150)" fill="#facc15" stroke="#ca8a04" stroke-width="2" />

  <!-- Neighbor Mustache in center-bottom -->
  <path d="M 220 355 Q 260 375 300 355 Q 310 380 285 385 Q 260 380 220 355 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />

  <!-- Glowing Star / Sparkle in Center -->
  <polygon points="360,190 366,204 380,206 370,216 372,230 360,222 348,230 350,216 340,206 354,204" fill="#fde047" filter="url(#glow)" />

  <!-- Title Badge Text -->
  <rect x="96" y="415" width="320" height="48" rx="24" fill="#020617" stroke="url(#gold)" stroke-width="3" />
  <text x="256" y="447" font-family="sans-serif" font-weight="900" font-size="24" fill="#fef08a" text-anchor="middle" letter-spacing="3">APK RUNNER</text>
</svg>
